name: Secrets

# Scans every pull request and every push to main for committed secrets, using
# the same gitleaks version parmana-core uses. Fails the check if any are found.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the commits in this change
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --log-opts="${{ github.event.pull_request.base.sha || github.event.before }}..HEAD" --redact --exit-code 1
